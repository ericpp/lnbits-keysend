[project]
name = "lnbits-keysend"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
description = "LNbits keysend extension for sending/receiving keysend payments with TLV routing."
authors = []
dependencies = ["lnbits>1"]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "black>=24.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest>=7.3.2",
    "mypy==1.17.1",
    "pre-commit>=3.2.2",
    "ruff>=0.3.2",
]

[tool.mypy]
plugins = "pydantic.mypy"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = [
  "lnbits.*",
]
ignore_missing_imports = "True"

[tool.pytest.ini_options]
log_cli = false
testpaths = [
  "tests"
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "A", "C", "N", "UP", "RUF", "B"]
ignore = ["C901"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "root_validator",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
]
